name: dbt CI

# Jalan otomatis setiap push & pull request ke main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: dbt build + test on BigQuery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt-bigquery
        run: pip install dbt-bigquery==1.12.0

      # Writes the SA key from Secrets and exports GOOGLE_APPLICATION_CREDENTIALS
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # dbt 'oauth' method picks up the credentials exported above (ADC)
      - name: Generate dbt profile
        run: |
          mkdir -p "$HOME/.dbt"
          cat > "$HOME/.dbt/profiles.yml" <<'PROFILE'
          retail_dbt:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: tokyo-epoch-226208
                dataset: analytics_ci
                location: US
                threads: 4
                timeout_seconds: 300
                priority: interactive
          PROFILE

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt build and test
        working-directory: dbt
        run: dbt build --target ci
